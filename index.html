<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Porodično Stablo Spasić</title>
    <style>
        body {
            font-family: 'Calibri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #app-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-left: 5px solid #2F5496;
            max-width: 320px;
        }

        #app-header h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #2F5496;
            font-weight: bold;
        }

        #app-header p {
            margin: 0;
            font-size: 12px;
            color: #7f8c8d;
        }

        #search-box {
            margin-top: 12px;
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
        }

        #search-box:focus {
            border-color: #2F5496;
        }

        /* Kontrole za zumiranje */
        #zoom-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zoom-btn {
            width: 45px;
            height: 45px;
            background: white;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 20px;
            font-weight: bold;
            color: #2F5496;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: background 0.2s;
        }

        .zoom-btn:active {
            background: #e1f5fe;
        }

        /* Beskonačno platno za stablo */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #canvas {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            padding: 200px;
            display: flex;
            flex-direction: column;
            gap: 150px;
            align-items: center;
        }

        /* Generacijski nivoi */
        .generation {
            display: flex;
            justify-content: center;
            gap: 120px;
            position: relative;
            z-index: 2;
        }

        /* Porodične grupe */
        .family-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .parents {
            display: flex;
            gap: 20px;
            position: relative;
            align-items: center;
        }

        /* Kartice članova */
        .node {
            width: 260px;
            height: 80px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 2px solid #2F5496;
            display: flex;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(47, 84, 150, 0.15);
        }

        .node.female {
            border-color: #C00000;
        }

        .node.deceased {
            border-color: #7f8c8d;
            background-color: #f8f9fa;
        }

        /* Slike i okviri */
        .avatar-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 12px;
            border: 2px solid #2F5496;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .node.female .avatar-container {
            border-color: #C00000;
        }

        .node.deceased .avatar-container {
            border-color: #7f8c8d;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            font-size: 24px;
            font-weight: bold;
            color: #2F5496;
        }

        .node.female .avatar-placeholder {
            color: #C00000;
        }

        .node.deceased .avatar-placeholder {
            color: #7f8c8d;
        }

        /* Informacije o članu */
        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .name {
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dates {
            font-size: 11px;
            color: #7f8c8d;
        }

        /* Tačke spajanja supružnika i linije */
        .marriage-connector {
            position: absolute;
            width: 20px;
            height: 2px;
            background-color: #7f8c8d;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Detalji (Modal) */
        #detail-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            padding: 25px;
            box-sizing: border-box;
        }

        #modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.4);
            z-index: 199;
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #2F5496;
            margin-right: 15px;
            object-fit: cover;
        }

        .modal-title h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #2c3e50;
        }

        .modal-title p {
            margin: 0;
            font-size: 14px;
            color: #7f8c8d;
        }

        .modal-body p {
            font-size: 14px;
            color: #34495e;
            line-height: 1.6;
            margin: 8px 0;
        }

        .close-btn {
            float: right;
            background: #2F5496;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        /* Istaknuto pretragu */
        .highlighted {
            animation: pulse 1.5s infinite;
            border-width: 4px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(47, 84, 150, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(47, 84, 150, 0); }
            100% { box-shadow: 0 0 0 0 rgba(47, 84, 150, 0); }
        }

        /* SVG za linije povezivanja */
        #svg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

    </div>

    <div id="modal-overlay" onclick="closeModal()"></div>

        <div style="margin-top: 20px; overflow: auto;">

        const families = [{"id": "@F76@", "husband": "@I211@", "wife": "@I213@", "children": ["@I21@"]}, {"id": "@F7@", "husband": "@I21@", "wife": "@I22@", "children": ["@I1@", "@I23@", "@I96@"]}, {"id": "@F34@", "husband": "@I149@", "wife": "@I96@", "children": ["@I98@"]}, {"id": "@F8@", "husband": "@I23@", "wife": "@I162@", "children": ["@I25@", "@I29@"]}, {"id": "@F1@", "husband": "@I1@", "wife": "@I2@", "children": ["@I3@", "@I4@", "@I5@"]}, {"id": "@F35@", "husband": "@I100@", "wife": "@I98@", "children": ["@I500015@"]}, {"id": "@F9@", "husband": "@I26@", "wife": "@I25@", "children": ["@I28@", "@I27@"]}, {"id": "@F10@", "husband": "@I30@", "wife": "@I29@", "children": ["@I161@"]}, {"id": "@F20@", "husband": "@I3@", "wife": "@I53@", "children": ["@I54@", "@I59@"]}, {"id": "@F4@", "husband": "@I12@", "wife": "@I4@", "children": ["@I11@", "@I13@"]}, {"id": "@F2@", "husband": "@I6@", "wife": "@I5@", "children": ["@I7@"]}, {"id": "@F22@", "husband": "@I54@", "wife": "@I56@", "children": ["@I58@"]}, {"id": "@F80@", "husband": "@I54@", "wife": "@I244@", "children": ["@I245@"]}, {"id": "@F23@", "husband": "@I59@", "wife": "@I60@", "children": ["@I61@", "@I62@"]}, {"id": "@F5@", "husband": "@I14@", "wife": "@I11@", "children": ["@I15@", "@I16@", "@I17@"]}, {"id": "@F6@", "husband": "@I18@", "wife": "@I13@", "children": ["@I19@", "@I146@"]}, {"id": "@F3@", "husband": "@I10@", "wife": "@I7@", "children": ["@I9@"]}, {"id": "@F81@", "husband": "@I245@", "wife": "@I246@", "children": ["@I500151@", "@I500154@"]}, {"id": "@F500112@", "husband": "@I500142@", "wife": "@I15@", "children": ["@I500153@"]}, {"id": "@F500105@", "husband": "@I500135@", "wife": "@I16@", "children": ["@I500160@"]}, {"id": "@F500127@", "husband": "@I500181@", "wife": "@I19@", "children": []}, {"id": "@F500126@", "husband": "@I500180@", "wife": "@I146@", "children": ["@I500182@"]}];

        // Konfiguracija generisanja generacija
        const genMapping = {
            "@I211@": 1, "@I213@": 1,
            "@I21@": 2, "@I22@": 2, "@I96@": 2, "@I149@": 2, "@I23@": 2, "@I162@": 2,
            "@I1@": 3, "@I2@": 3, "@I98@": 3, "@I100@": 3, "@I25@": 3, "@I26@": 3, "@I29@": 3, "@I30@": 3,
            "@I3@": 4, "@I53@": 4, "@I4@": 4, "@I12@": 4, "@I5@": 4, "@I6@": 4, "@I500015@": 4, "@I27@": 4, "@I28@": 4, "@I161@": 4,
            "@I54@": 5, "@I56@": 5, "@I244@": 5, "@I59@": 5, "@I60@": 5, "@I11@": 5, "@I14@": 5, "@I13@": 5, "@I18@": 5, "@I7@": 5, "@I10@": 5,
            "@I58@": 6, "@I245@": 6, "@I246@": 6, "@I61@": 6, "@I62@": 6, "@I15@": 6, "@I500142@": 6, "@I16@": 6, "@I500135@": 6, "@I17@": 6, "@I19@": 6, "@I500181@": 6, "@I146@": 6, "@I500180@": 6, "@I9@": 6,
            "@I500151@": 7, "@I500154@": 7, "@I500153@": 7, "@I500160@": 7, "@I500182@": 7
        };

        // Renderovanje svih čvorova u generacije
        function renderTree() {
            // Grupisanje individua po generacijama
            const genContainers = {
                1: document.getElementById('gen1'),
                2: document.getElementById('gen2'),
                3: document.getElementById('gen3'),
                4: document.getElementById('gen4'),
                5: document.getElementById('gen5'),
                6: document.getElementById('gen6'),
                7: document.getElementById('gen7')
            };

            // Prvo renderujemo porodične jedinice (supružnike spojene)
            families.forEach(fam => {
                const husb = individuals.find(i => i.id === fam.husband);
                const wife = individuals.find(i => i.id === fam.wife);
                
                if (husb || wife) {
                    const gen = husb ? genMapping[husb.id] : genMapping[wife.id];
                    const famUnit = document.createElement('div');
                    famUnit.className = 'family-unit';
                    famUnit.id = 'fam_unit_' + fam.id.replace(/@/g, '');

                    const parentsDiv = document.createElement('div');
                    parentsDiv.className = 'parents';

                    if (husb) parentsDiv.appendChild(createNode(husb));
                    if (wife) parentsDiv.appendChild(createNode(wife));

                    famUnit.appendChild(parentsDiv);
                    if (genContainers[gen]) {
                        genContainers[gen].appendChild(famUnit);
                    }
                }
            });

            // Dodajemo i samce koji nisu u brakovima
            individuals.forEach(ind => {
                const isRendered = document.getElementById('node_' + ind.id.replace(/@/g, ''));
                if (!isRendered) {
                    const gen = genMapping[ind.id] || 4;
                    const famUnit = document.createElement('div');
                    famUnit.className = 'family-unit';
                    famUnit.appendChild(createNode(ind));
                    if (genContainers[gen]) {
                        genContainers[gen].appendChild(famUnit);
                    }
                }
            });

            // Sačekaj da se sve iscrta, pa nacrtaj spojne linije
            setTimeout(drawLines, 100);
        }

        function createNode(ind) {
            const div = document.createElement('div');
            const cleanId = ind.id.replace(/@/g, '');
            div.className = 'node';
            div.id = 'node_' + cleanId;
            if (ind.gender === 'F') div.classList.add('female');
            if (ind.death || ind.id === '@I21@' || ind.id === '@I22@') div.classList.add('deceased');

            // Avatar slika ili placeholder
            let avatarHTML = '';
            if (ind.photo) {
                avatarHTML = `<img class="avatar-img" src="${ind.photo}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`;
            }
            
            const firstLetter = ind.name ? ind.name.charAt(0) : '?';
            avatarHTML += `<div class="avatar-placeholder" style="display:${ind.photo ? 'none' : 'flex'}">${firstLetter}</div>`;

            const b_year = ind.birth || '???';
            const d_year = ind.death ? ind.death : (ind.id === '@I21@' || ind.id === '@I22@' ? '†' : '');
            const dateStr = d_year ? "(" + b_year + " - " + d_year + ")" : "(r. " + b_year + ")";

            div.innerHTML = `
                <div class="avatar-container">${avatarHTML}</div>
                <div class="info">
                    <div class="name">${ind.name}</div>
                    <div class="dates">${dateStr}</div>
                </div>
            `;

            div.onclick = (e) => {
                e.stopPropagation();
                showDetails(ind);
            };

            return div;
        }

        // Iscrtavanje linija između roditelja i dece pomoću SVG-a
        function drawLines() {
            const svg = document.getElementById('svg-lines');
            svg.innerHTML = ''; // reset

            const canvas = document.getElementById('canvas');
            const canvasRect = canvas.getBoundingClientRect();
            
            svg.setAttribute('width', canvasRect.width);
            svg.setAttribute('height', canvasRect.height);

            families.forEach(fam => {
                const husbNode = document.getElementById('node_' + fam.husband.replace(/@/g, ''));
                const wifeNode = document.getElementById('node_' + fam.wife.replace(/@/g, ''));
                
                let parentCenterX, parentCenterY;

                if (husbNode && wifeNode) {
                    const hRect = husbNode.getBoundingClientRect();
                    const wRect = wifeNode.getBoundingClientRect();

                    const hX = hRect.left - canvasRect.left + hRect.width / 2;
                    const hY = hRect.top - canvasRect.top + hRect.height / 2;
                    const wX = wRect.left - canvasRect.left + wRect.width / 2;
                    const wY = wRect.top - canvasRect.top + wRect.height / 2;

                    // Spojnica muža i žene
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', hX);
                    line.setAttribute('y1', hY);
                    line.setAttribute('x2', wX);
                    line.setAttribute('y2', wY);
                    line.setAttribute('stroke', '#7f8c8d');
                    line.setAttribute('stroke-width', '2');
                    line.setAttribute('stroke-dasharray', '5,5');
                    svg.appendChild(line);

                    parentCenterX = (hX + wX) / 2;
                    parentCenterY = (hY + wY) / 2;
                } else if (husbNode) {
                    const hRect = husbNode.getBoundingClientRect();
                    parentCenterX = hRect.left - canvasRect.left + hRect.width / 2;
                    parentCenterY = hRect.top - canvasRect.top + hRect.height;
                } else if (wifeNode) {
                    const wRect = wifeNode.getBoundingClientRect();
                    parentCenterX = wRect.left - canvasRect.left + wRect.width / 2;
                    parentCenterY = wRect.top - canvasRect.top + wRect.height;
                }

                // Povezivanje dece
                if (fam.children && fam.children.length > 0 && parentCenterX) {
                    // Spuštanje zajedničke linije dole od roditelja
                    const midY = parentCenterY + 50;
                    
                    const verticalLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    verticalLine.setAttribute('x1', parentCenterX);
                    verticalLine.setAttribute('y1', parentCenterY);
                    verticalLine.setAttribute('x2', parentCenterX);
                    verticalLine.setAttribute('y2', midY);
                    verticalLine.setAttribute('stroke', '#2F5496');
                    verticalLine.setAttribute('stroke-width', '2');
                    svg.appendChild(verticalLine);

                    let minChildX = Infinity;
                    let maxChildX = -Infinity;
                    const childPoints = [];

                    fam.children.forEach(childId => {
                        const childNode = document.getElementById('node_' + childId.replace(/@/g, ''));
                        if (childNode) {
                            const cRect = childNode.getBoundingClientRect();
                            const cX = cRect.left - canvasRect.left + cRect.width / 2;
                            const cY = cRect.top - canvasRect.top;

                            childPoints.push({x: cX, y: cY});
                            if (cX < minChildX) minChildX = cX;
                            if (cX > maxChildX) maxChildX = cX;
                        }
                    });

                    if (childPoints.length > 0) {
                        // Horizontalna razvodna linija
                        const horizLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        horizLine.setAttribute('x1', minChildX);
                        horizLine.setAttribute('y1', midY);
                        horizLine.setAttribute('x2', maxChildX);
                        horizLine.setAttribute('y2', midY);
                        horizLine.setAttribute('stroke', '#2F5496');
                        horizLine.setAttribute('stroke-width', '2');
                        svg.appendChild(horizLine);

                        // Vertikalne linije do svakog deteta
                        childPoints.forEach(pt => {
                            const downLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            downLine.setAttribute('x1', pt.x);
                            downLine.setAttribute('y1', midY);
                            downLine.setAttribute('x2', pt.x);
                            downLine.setAttribute('y2', pt.y);
                            downLine.setAttribute('stroke', '#2F5496');
                            downLine.setAttribute('stroke-width', '2');
                            svg.appendChild(downLine);
                        });
                    }
                }
            });
        }

        // Otvaranje modalnog prozora sa detaljima člana
        function showDetails(ind) {
            document.getElementById('modal-name').innerText = ind.name;
            const b_year = ind.birth || '???';
            const d_year = ind.death ? ind.death : (ind.id === '@I21@' || ind.id === '@I22@' ? '†' : '');
            document.getElementById('modal-dates').innerText = d_year ? b_year + " - " + d_year : "Rođen/a: " + b_year;
            document.getElementById('modal-notes').innerText = ind.notes || "Nema zabeleženih istorijskih podataka za ovog člana.";

            const imgEl = document.getElementById('modal-img');
            if (ind.photo) {
                imgEl.src = ind.photo;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('detail-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('detail-modal').style.display = 'none';
        }

        // Drag & Zoom funkcionalnost (prilagođena i za iPad Touch ekrane)
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');

        let zoomLevel = 0.65;
        let panX = window.innerWidth / 2 - 300;
        let panY = 100;
        let isDragging = false;
        let startX, startY;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }

        // Početno pozicioniranje
        resetView();

        function zoom(amount) {
            zoomLevel = Math.max(0.15, Math.min(2.0, zoomLevel + amount));
            updateTransform();
            drawLines();
        }

        function resetView() {
            zoomLevel = 0.65;
            panX = window.innerWidth / 2 - 1200;
            panY = 100;
            updateTransform();
            setTimeout(drawLines, 150);
        }

        // Miš i touch događaji za pomeranje stabla
        function startDrag(e) {
            isDragging = true;
            startX = (e.pageX || e.touches[0].pageX) - panX;
            startY = (e.pageY || e.touches[0].pageY) - panY;
        }

        // Touch drag
        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            panX = (e.pageX || e.touches[0].pageX) - startX;
            panY = (e.pageY || e.touches[0].pageY) - startY;
            updateTransform();
        }

        function stopDrag() {
            isDragging = false;
        }

        viewport.addEventListener('mousedown', startDrag);
        viewport.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', stopDrag);

        viewport.addEventListener('touchstart', startDrag, {passive: false});
        viewport.addEventListener('touchmove', drag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        window.addEventListener('resize', () => {
            drawLines();
        });

        // Pretraga članova
        function searchMembers() {
            const query = document.getElementById('search-box').value.toLowerCase().trim();
            
            // Skidanje prethodnih svetala
            document.querySelectorAll('.node').forEach(node => {
                node.classList.remove('highlighted');
            });

            if (query.length < 2) return;

            const found = individuals.find(ind => ind.name.toLowerCase().includes(query));
            if (found) {
                const node = document.getElementById('node_' + found.id.replace(/@/g, ''));
                if (node) {
                    node.classList.add('highlighted');
                    
                    // Automatsko centriranje na pronađenog člana
                    const canvasRect = canvas.getBoundingClientRect();
                    const nodeRect = node.getBoundingClientRect();

                    const nodeCenterX = nodeRect.left - canvasRect.left + nodeRect.width / 2;
                    const nodeCenterY = nodeRect.top - canvasRect.top + nodeRect.height / 2;

                    panX = window.innerWidth / 2 - nodeCenterX * zoomLevel;
                    panY = window.innerHeight / 2 - nodeCenterY * zoomLevel;
                    
                    updateTransform();
                    setTimeout(drawLines, 150);
                }
            }
        }

        // Pokretanje iscrtavanja stabla
        renderTree();
    </script>
