<html lang="sr">
<head>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            cursor: grab;
            transition: transform 0.05s ease-out;
        }

        #canvas:active {
            cursor: grabbing;
        }

        #svg-lines {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        #tree-nodes {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* Person Cards */
        .card {
            position: absolute;
            width: 170px;
            height: 58px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border: 2px solid #2F5496;
            display: flex;
            align-items: center;
            padding: 4px 8px;
            box-sizing: border-box;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .card.female {
            border-color: #c2185b;
        }

        .card.deceased {
            background-color: #f8f9fa;
        }

        .card:hover {
            border-color: #1a237e;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        }

        .card-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e9ecef;
            flex-shrink: 0;
            margin-right: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #2F5496;
            border: 1px solid #ced0d4;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .card-name {
            font-size: 12px;
            font-weight: 700;
            color: #1c1e21;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .card-dates {
            font-size: 10.5px;
            color: #65676b;
            margin-top: 2px;
            font-weight: 500;
        }

        .toggle-btn {
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2F5496;
            color: white;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 5;
            transition: background 0.2s;
        }

        .toggle-btn:hover {
            background: #1a237e;
        }

        /* Floating UI Headers */
        #header-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            border-left: 5px solid #2F5496;
            width: 320px;
            backdrop-filter: blur(5px);
        }

        #header-panel h1 {
            margin: 0 0 4px 0;
            font-size: 19px;
            color: #2F5496;
            font-weight: 700;
        }

        #header-panel p {
            margin: 0 0 12px 0;
            font-size: 12px;
            color: #65676b;
            line-height: 1.4;
        }

        #search-container {
            position: relative;
        }

        #search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 14px;
            border: 1px solid #ced0d4;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        #search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-height: 240px;
            overflow-y: auto;
            margin-top: 5px;
            display: none;
            z-index: 20;
        }

        .search-item {
            padding: 9px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f2f5;
            font-size: 12.5px;
            display: flex;
            align-items: center;
        }

        .search-item:hover {
            background-color: #f0f2f5;
        }

            right: -380px;
            bottom: 20px;

            z-index: 10;

            flex-direction: column;
            overflow: hidden;
        }

        #detail-sidebar.open {
            right: 20px;
        }

        .sidebar-header {
            background: #2F5496;
            color: white;
            padding: 18px;
            position: relative;
            text-align: center;
        }

        .sidebar-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            outline: none;
        }

            height: 75px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: #2F5496;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .sidebar-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-name {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .sidebar-dates {
            font-size: 12px;
            opacity: 0.9;
            margin: 0;
        }

        .sidebar-content {
            padding: 18px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .info-group {
            margin-bottom: 16px;
        }

        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #8a8d91;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 13.5px;
            color: #1c1e21;
            line-height: 1.4;
            word-break: break-word;
        }

            background: #e8eaf6;
            color: #1a237e;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px 4px 2px 0;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .rel-link:hover {
            background: #c5cae9;
        }

        /* Zoom Controls */
        #zoom-controls {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white;
            border: none;

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #555;
            outline: none;
        }

        .zoom-btn:hover {
            background-color: #f0f2f5;
            color: #2F5496;

                        childrenW += calculateSubtreeWidth(cId) + SIBLING_GAP;
                    });
                    childrenW -= SIBLING_GAP;
                }

                const famW = Math.max(coupleW, childrenW);
                totalWidth += famW + SIBLING_GAP * 2;
            });

            return Math.max(CARD_WIDTH, totalWidth - SIBLING_GAP * 2);
        }

        function positionSubtree(personId, startX, startY) {
            const fIds = spouseFams[personId] || [];

            if (fIds.length === 0) {
                if (!pos[personId]) pos[personId] = { x: startX, y: startY };
                return;
            }

            let currX = startX;
            fIds.forEach(fId => {
                const fam = famMap[fId];
                if (!fam) return;

                const spouseId = fam.husband === personId ? fam.wife : fam.husband;
                const children = fam.children || [];

                let childrenTotalWidth = 0;
                children.forEach(cId => {
                    childrenTotalWidth += calculateSubtreeWidth(cId) + SIBLING_GAP;
                });
                if (children.length > 0) childrenTotalWidth -= SIBLING_GAP;

                let coupleW = spouseId ? (CARD_WIDTH * 2 + COUPLE_GAP) : CARD_WIDTH;
                let unitWidth = Math.max(coupleW, childrenTotalWidth);

                let coupleStartX = currX + (unitWidth - coupleW) / 2;

                if (spouseId) {
                    const hId = fam.husband || personId;
                    const wId = fam.wife || spouseId;
                    pos[hId] = { x: coupleStartX, y: startY };
                    pos[wId] = { x: coupleStartX + CARD_WIDTH + COUPLE_GAP, y: startY };
                } else {
                    pos[personId] = { x: coupleStartX, y: startY };
                }

                if (children.length > 0) {
                    let childStartX = currX + (unitWidth - childrenTotalWidth) / 2;
                    children.forEach(cId => {
                        const cW = calculateSubtreeWidth(cId);
                        positionSubtree(cId, childStartX, startY + RANK_HEIGHT);
                        childStartX += cW + SIBLING_GAP;
                    });
                }

                currX += unitWidth + SIBLING_GAP * 2;
            });
        }

        positionSubtree('@I211@', 1000, 100);

        function positionParentAncestors(childId) {
            const pfId = parentFam[childId];
            if (!pfId) return;
            const pf = famMap[pfId];
            if (!pf) return;

            const cPos = pos[childId];
            if (!cPos) return;

            const parentY = cPos.y - RANK_HEIGHT;
            const hId = pf.husband;
            const wId = pf.wife;
            const siblings = pf.children || [childId];

            if (hId && wId) {
                const coupleCenterX = cPos.x + CARD_WIDTH / 2;
                pos[hId] = { x: coupleCenterX - CARD_WIDTH - COUPLE_GAP / 2, y: parentY };
                pos[wId] = { x: coupleCenterX + COUPLE_GAP / 2, y: parentY };

                if (expandedSpouseAncestors.has(hId)) positionParentAncestors(hId);
                if (expandedSpouseAncestors.has(wId)) positionParentAncestors(wId);
            } else if (hId) {
                pos[hId] = { x: cPos.x, y: parentY };
                if (expandedSpouseAncestors.has(hId)) positionParentAncestors(hId);
            } else if (wId) {
                pos[wId] = { x: cPos.x, y: parentY };
                if (expandedSpouseAncestors.has(wId)) positionParentAncestors(wId);
            }

            // Position ALL siblings born to this parent family alongside childId!
            const otherSiblings = siblings.filter(sId => sId !== childId);
            let leftOffset = cPos.x;
            let rightOffset = cPos.x + CARD_WIDTH + SIBLING_GAP;

            otherSiblings.forEach((sId, idx) => {
                if (!pos[sId]) {
                    if (idx % 2 === 0) {
                        pos[sId] = { x: rightOffset, y: cPos.y };
                        rightOffset += CARD_WIDTH + SIBLING_GAP;
                    } else {
                        leftOffset -= CARD_WIDTH + SIBLING_GAP;
                        pos[sId] = { x: leftOffset, y: cPos.y };
                    }
                }
            });
        }

        expandedSpouseAncestors.forEach(personId => {
            positionParentAncestors(personId);
        });

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        Object.values(pos).forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.x + CARD_WIDTH > maxX) maxX = p.x + CARD_WIDTH;
            if (p.y < minY) minY = p.y;
            if (p.y + CARD_HEIGHT > maxY) maxY = p.y + CARD_HEIGHT;
        });

        const svgW = Math.max(window.innerWidth * 3, maxX + 800);
        const svgH = Math.max(window.innerHeight * 3, maxY + 800);

        svgLines.setAttribute('width', svgW);
        svgLines.setAttribute('height', svgH);

        // Render 100% Solid Connecting Lines
        rawFamilies.forEach(fam => {
            const h = pos[fam.husband];
            const w = pos[fam.wife];

            let midX = 0;
            let midY = 0;

            if (h && w) {
                const hRightX = h.x + CARD_WIDTH;
                const hMidY = h.y + CARD_HEIGHT / 2;
                const wLeftX = w.x;
                const wMidY = w.y + CARD_HEIGHT / 2;

                const coupleLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                coupleLine.setAttribute('x1', hRightX);
                coupleLine.setAttribute('y1', hMidY);
                coupleLine.setAttribute('x2', wLeftX);
                coupleLine.setAttribute('y2', wMidY);
                coupleLine.setAttribute('stroke', '#2c3e50');
                coupleLine.setAttribute('stroke-width', '2.5');
                coupleLine.setAttribute('stroke-dasharray', 'none');
                svgLines.appendChild(coupleLine);

                midX = (hRightX + wLeftX) / 2;
                midY = hMidY;
            } else if (h) {
                midX = h.x + CARD_WIDTH / 2;
                midY = h.y + CARD_HEIGHT;
            } else if (w) {
                midX = w.x + CARD_WIDTH / 2;
                midY = w.y + CARD_HEIGHT;
            }

            if (fam.children && fam.children.length > 0 && midX > 0) {
                const childNodes = fam.children.map(cId => pos[cId]).filter(Boolean);
                if (childNodes.length > 0) {
                    const dropY = midY + (RANK_HEIGHT - CARD_HEIGHT) / 2;

                    const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    vLine.setAttribute('x1', midX);
                    vLine.setAttribute('y1', midY);
                    vLine.setAttribute('x2', midX);
                    vLine.setAttribute('y2', dropY);
                    vLine.setAttribute('stroke', '#2F5496');
                    vLine.setAttribute('stroke-width', '2');
                    vLine.setAttribute('stroke-dasharray', 'none');
                    svgLines.appendChild(vLine);

                    let minCX = Infinity, maxCX = -Infinity;
                    childNodes.forEach(cPos => {
                        const cX = cPos.x + CARD_WIDTH / 2;
                        if (cX < minCX) minCX = cX;
                        if (cX > maxCX) maxCX = cX;
                    });

                    const hBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    hBar.setAttribute('x1', Math.min(midX, minCX));
                    hBar.setAttribute('y1', dropY);
                    hBar.setAttribute('x2', Math.max(midX, maxCX));
                    hBar.setAttribute('y2', dropY);
                    hBar.setAttribute('stroke', '#2F5496');
                    hBar.setAttribute('stroke-width', '2');
                    hBar.setAttribute('stroke-dasharray', 'none');
                    svgLines.appendChild(hBar);

                    childNodes.forEach(cPos => {
                        const cX = cPos.x + CARD_WIDTH / 2;
                        const cTopY = cPos.y;

                        const cLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        cLine.setAttribute('x1', cX);
                        cLine.setAttribute('y1', dropY);
                        cLine.setAttribute('x2', cX);
                        cLine.setAttribute('y2', cTopY);
                        cLine.setAttribute('stroke', '#2F5496');
                        cLine.setAttribute('stroke-width', '2');
                        cLine.setAttribute('stroke-dasharray', 'none');
                        svgLines.appendChild(cLine);
                    });
                }
            }
        });

        // Render Person Cards
        Object.keys(pos).forEach(personId => {
            const ind = indMap[personId];
            if (!ind) return;
            const p = pos[personId];

            const card = document.createElement('div');
            card.className = 'card ' + (ind.gender === 'F' ? 'female' : 'male') + (ind.is_deceased ? ' deceased' : '');
            card.style.left = p.x + 'px';
            card.style.top = p.y + 'px';

            const pfId = parentFam[personId];
            if (pfId) {
                const toggleBtn = document.createElement('div');
                toggleBtn.className = 'toggle-btn';
                const isExp = expandedSpouseAncestors.has(personId);
                toggleBtn.textContent = isExp ? '-' : '+';
                toggleBtn.title = isExp ? 'Sakrij roditelje i familiju' : 'Prikaži roditelje i familiju';

                toggleBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (isExp) {
                        expandedSpouseAncestors.delete(personId);
                    } else {
                        expandedSpouseAncestors.add(personId);
                    }
                    layoutTree();
                };
                card.appendChild(toggleBtn);
            }

            const avatar = document.createElement('div');
            avatar.className = 'card-avatar';

            if (ind.photo) {
                const img = document.createElement('img');
                const pName = ind.photo;
                img.src = pName;

                img.onerror = function() {
                    if (ind.photo_url) {
                        this.src = ind.photo_url;
                        this.onerror = function() {
                            avatar.textContent = ind.name ? ind.name.charAt(0) : '?';
                        };
                    } else {
                        avatar.textContent = ind.name ? ind.name.charAt(0) : '?';
                    }
                };

                avatar.appendChild(img);
            } else {
                avatar.textContent = ind.name ? ind.name.charAt(0) : '?';
            }

            const info = document.createElement('div');
            info.className = 'card-info';

            const nameEl = document.createElement('div');
            nameEl.className = 'card-name';
            nameEl.textContent = ind.name;

            const datesEl = document.createElement('div');
            datesEl.className = 'card-dates';

            const bYear = ind.birth_year || '?';
            const dYear = ind.death_year || '';
            datesEl.textContent = dYear ? (bYear + ' - ' + dYear) : ('r. ' + bYear);

            info.appendChild(nameEl);
            info.appendChild(datesEl);

            card.appendChild(avatar);
            card.appendChild(info);

            card.onclick = () => {
                showMemberDetails(ind);
            };

            treeNodes.appendChild(card);
        });
    }

    function centerTreeOnPerson(personId) {
        const p = pos[personId] || pos['@I1@'];
        if (!p) return;

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        scale = 0.85;
        translateX = (screenW / 2) - (p.x + CARD_WIDTH / 2) * scale;
        translateY = (screenH / 2.8) - (p.y + CARD_HEIGHT / 2) * scale;

        canvas.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
        updateTransform();
    }

    const sidebar = document.getElementById('detail-sidebar');

    function showMemberDetails(ind) {
        document.getElementById('side-name').textContent = ind.name;

        const bYr = ind.birth_year || '?';
        const dYr = ind.death_year || '';
        document.getElementById('side-dates').textContent = dYr ? ('(' + bYr + ' - ' + dYr + ')') : ('(r. ' + bYr + ')');

        // Parents
        const parentsEl = document.getElementById('side-parents');
        parentsEl.innerHTML = '';
        const pfId = parentFam[ind.id];
        if (pfId && famMap[pfId]) {
            const pf = famMap[pfId];
            if (pf.husband && indMap[pf.husband]) {
                const btn = document.createElement('span');
                btn.className = 'rel-link';
                btn.textContent = 'Otac: ' + indMap[pf.husband].name;
                btn.onclick = () => { centerTreeOnPerson(pf.husband); showMemberDetails(indMap[pf.husband]); };
                parentsEl.appendChild(btn);
            }
            if (pf.wife && indMap[pf.wife]) {
                const btn = document.createElement('span');
                btn.className = 'rel-link';
                btn.textContent = 'Majka: ' + indMap[pf.wife].name;
                btn.onclick = () => { centerTreeOnPerson(pf.wife); showMemberDetails(indMap[pf.wife]); };
                parentsEl.appendChild(btn);
            }
        } else {
            parentsEl.textContent = '-';
        }

        // Siblings
        const sibsEl = document.getElementById('side-siblings');
        sibsEl.innerHTML = '';
        if (pfId && famMap[pfId]) {
            const siblings = (famMap[pfId].children || []).filter(cId => cId !== ind.id);
            if (siblings.length > 0) {
                siblings.forEach(sId => {
                    if (indMap[sId]) {
                        const btn = document.createElement('span');
                        btn.className = 'rel-link';
                        btn.textContent = indMap[sId].name;
                        btn.onclick = () => { centerTreeOnPerson(sId); showMemberDetails(indMap[sId]); };
                        sibsEl.appendChild(btn);
                    }
                });
            } else {
                sibsEl.textContent = 'Nema zabeležene braće i sestara';
            }
        } else {
            sibsEl.textContent = '-';
        }

        // Spouse
        const spouseEl = document.getElementById('side-spouse');
        spouseEl.innerHTML = '';
        const sfIds = spouseFams[ind.id] || [];
        if (sfIds.length > 0) {
            sfIds.forEach(fId => {
                const fam = famMap[fId];
                if (fam) {
                    const spId = fam.husband === ind.id ? fam.wife : fam.husband;
                    if (spId && indMap[spId]) {
                        const btn = document.createElement('span');
                        btn.className = 'rel-link';
                        btn.textContent = indMap[spId].name;
                        btn.onclick = () => { centerTreeOnPerson(spId); showMemberDetails(indMap[spId]); };
                        spouseEl.appendChild(btn);
                    }
                }
            });
        } else {
            spouseEl.textContent = '-';
        }

        // Children
        const childrenEl = document.getElementById('side-children');
        childrenEl.innerHTML = '';
        let allChildren = [];
        sfIds.forEach(fId => {
            const fam = famMap[fId];
            if (fam && fam.children) {
                allChildren = allChildren.concat(fam.children);
            }
        });
        if (allChildren.length > 0) {
            allChildren.forEach(cId => {
                if (indMap[cId]) {
                    const btn = document.createElement('span');
                    btn.className = 'rel-link';
                    btn.textContent = indMap[cId].name;
                    btn.onclick = () => { centerTreeOnPerson(cId); showMemberDetails(indMap[cId]); };
                    childrenEl.appendChild(btn);
                }
            });
        } else {
            childrenEl.textContent = '-';
        }

        document.getElementById('side-birth-place').textContent = ind.birth_place || '-';
        document.getElementById('side-death-place').textContent = ind.death_place || '-';

        const emailEl = document.getElementById('side-email');
        if (ind.email) {
            emailEl.innerHTML = '<a href="mailto:' + ind.email + '">' + ind.email + '</a>';
        } else {
            emailEl.textContent = '-';
        }

        document.getElementById('side-notes').textContent = ind.notes || 'Nema dodatnih beleški.';

        const avatarContainer = document.getElementById('side-avatar');
        avatarContainer.innerHTML = '';
        if (ind.photo) {
            const img = document.createElement('img');
            img.src = ind.photo;
            img.onerror = function() {
                if (ind.photo_url) {
                    this.src = ind.photo_url;
                    this.onerror = function() { avatarContainer.textContent = ind.name.charAt(0); };
                } else {
                    avatarContainer.textContent = ind.name.charAt(0);
                }
            };
            avatarContainer.appendChild(img);
        } else {
            avatarContainer.textContent = ind.name.charAt(0);
        }

        sidebar.classList.add('open');
    }

    document.getElementById('sidebar-close-btn').onclick = () => {
        sidebar.classList.remove('open');
    };

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        searchResults.innerHTML = '';

        if (!query) {
            searchResults.style.display = 'none';
            return;
        }

        const matches = rawIndividuals.filter(ind => ind.name && ind.name.toLowerCase().includes(query));

        if (matches.length === 0) {
            searchResults.style.display = 'none';
            return;
        }

        matches.slice(0, 10).forEach(match => {
            const item = document.createElement('div');
            item.className = 'search-item';

            const nameSpan = document.createElement('span');
            nameSpan.innerHTML = match.name;

            item.appendChild(nameSpan);

            item.onclick = () => {
                centerTreeOnPerson(match.id);
                showMemberDetails(match);
                searchResults.style.display = 'none';
                searchInput.value = match.name;
            };

            searchResults.appendChild(item);
        });

        searchResults.style.display = 'block';
    });

    window.addEventListener('load', () => {
        layoutTree();
        centerTreeOnPerson('@I1@');
    });
</script>
</body>
